services:
  web:
    build: .
    container_name: intercert-landing
    ports:
      - "8080:80"
    volumes:
      # Montar archivos para desarrollo en tiempo real
      - ./:/var/www/html/
      # Excluir ciertos archivos del montaje
      - /var/www/html/node_modules
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html
    restart: unless-stopped
    networks:
      - intercert-network
    labels:
      - "com.intercert.description=INTERCERT Landing Page con PHP y Apache"

networks:
  intercert-network:
    driver: bridge
